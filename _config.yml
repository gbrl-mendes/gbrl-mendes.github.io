  <br><br>
  <b>Cientista de Dados</b> e <b>Bioinformata</b> com 10 anos de experiência transformando dados biológicos e ambientais heterogêneos em sistemas confiáveis, auditáveis e reutilizáveis.
  <br><br>
  Mestre em Genética (UFMG) e doutorando em Bioinformática, onde desenvolvo pipelines de análise de dados. Minha principal experiência é construindo a ponte entre os dados brutos e suas análises: pipelines de ingestão, validação e curadoria, código versionado, interfaces e a infraestrutura Linux em que tudo roda, com Python, R, SQL, Bash, Git e Docker.
  <br><br>
  Minha base está em dados biológicos e ambientais, com destaque para metabarcoding de eDNA e chamada de variantes. Hoje, trabalho também na combinação de código determinístico com LLMs, usando o modelo onde ele agrega valor e mantendo as etapas críticas rastreáveis e reproduzíveis.
  <br><br>
  Meu foco é entregar resultados claros e reprodutíveis, multiplataforma.
