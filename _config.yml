  <br><br>
  <b>Data Scientist</b> and <b>Bioinformatician</b> with +7 years of experience turning heterogeneous data into reliable, reusable systems.
  <br><br>
  M.Sc. in Genetics (UFMG) and Ph.D. candidate in Bioinformatics, developing cross-platform software. I build the technical layer between raw data and domain specialists: ingestion, validation and curation pipelines, version-controlled code, interfaces, and the Linux servers they run on, using Python, R, SQL, Bash, Git and Docker.
  <br><br>
  My background is in environmental and biological data (eDNA metabarcoding, variant calling), and I work on combining deterministic code with LLMs in auditable ways. I focus on reproducibility and clear hand-offs, so specialists can spend their time on interpretation instead of data wrangling.
