  <b>Cientista de Dados</b> e <b>Bioinformata</b> com mais de 7 anos de experiência transformando dados heterogêneos em sistemas confiáveis e reutilizáveis.
  <br><br>
  Mestre em Genética (UFMG) e doutorando em Bioinformática, desenvolvendo software multiplataforma. Construo a camada técnica entre os dados brutos e os especialistas de domínio: pipelines de ingestão, validação e curadoria, código versionado, interfaces e os servidores Linux onde tudo roda, com Python, R, SQL, Bash, Git e Docker.
  <br><br>
  Minha base é em dados ambientais e biológicos (metabarcoding de eDNA, chamada de variantes), e trabalho na combinação auditável de código determinístico com LLMs. Foco em reprodutibilidade e em entregas claras, para que os especialistas gastem seu tempo interpretando os resultados, e não preparando os dados.
