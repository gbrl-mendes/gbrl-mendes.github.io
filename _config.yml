  <a href="https://www.linkedin.com/in/gabriel-mendes-b2b4432ba/">LinkedIn Profile</a>|<a href="http://lattes.cnpq.br/8573247637516819">Lattes CV</a>|<a href="https://orcid.org/0000-0002-1260-5993">Orcid Profile</a>
  <br><br>
  <b>Data Scientist</b> and <b>Bioinformatician</b> with 10 years of experience turning heterogeneous biological and environmental data into reliable, auditable and reusable systems.
  <br><br>
  M.Sc. in Genetics (UFMG) and Ph.D. candidate in Bioinformatics, where I develop data analysis pipelines. My main experience is building the bridge between raw data and its analyses: ingestion, validation and curation pipelines, version-controlled code, interfaces and the Linux infrastructure where everything runs, using Python, R, SQL, Bash, Git and Docker.
  <br><br>
  My foundation is in biological and environmental data, especially eDNA metabarcoding and variant calling. Today I also work on combining deterministic code with LLMs, using the model where it adds value and keeping critical steps traceable and reproducible.
  <br><br>
  My focus is delivering clear, reproducible, cross-platform results.
